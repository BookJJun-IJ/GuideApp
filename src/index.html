<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef6fd">
<meta name="description" content="Your starting point for PCS. Answer a few questions, get the right apps.">
<meta property="og:title" content="Start Here — Your PCS">
<meta property="og:description" content="Answer a few questions and get a personalized set of apps for your Personal Cloud Server.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<title>Start Here — Your PCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <defs><linearGradient id="yg" x1="0" y1="0" x2="64" y2="0">
            <stop offset="0" stop-color="#27aae1"/><stop offset="1" stop-color="#ee2a7b"/>
          </linearGradient></defs>
          <path d="M20 40c-7 0-12-4.5-12-11 0-6 4.6-10.4 10.7-10.8C21 12 26.6 8 33 8c8 0 14 5.6 14.6 13C53 21.6 57 26 57 31.5 57 37.6 52 42 45 42"
            fill="#dcebf9" stroke="url(#yg)" stroke-width="3.4" stroke-linejoin="round"/>
          <path d="M26 30l6 7m0 0 6-7m-6 7v10" stroke="#3d617f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="32" cy="50" r="3.2" fill="#3d617f"/>
        </svg>
        <div>
          <div class="brand-name">Start Here</div>
          <div class="brand-sub">Your Personal Cloud Server</div>
        </div>
      </div>
      <div class="hdr-right">
        <div class="langpill" id="lang">
          <button data-l="en" class="on">EN</button>
          <button data-l="fr">FR</button>
          <button data-l="ko">KO</button>
        </div>
        <button class="redo-btn" id="redoBtn" hidden></button>
      </div>
    </div>
  </div>
</header>

<!-- ONBOARDING WIZARD (full-screen stepped) -->
<section class="wizard" id="wizard" hidden aria-live="polite">
  <div class="wiz-inner">
    <div class="wiz-progress" id="wizProgress"></div>
    <h1 class="wiz-q" id="wizTitle"></h1>
    <p class="wiz-sub" id="wizSub"></p>
    <div class="wiz-opts" id="wizOpts"></div>
    <div class="wiz-nav">
      <button class="btn btn-ghost" id="wizBack"></button>
      <div class="wiz-nav-right">
        <button class="linkbtn" id="wizSkip"></button>
        <button class="btn btn-solid" id="wizNext" hidden></button>
      </div>
    </div>
  </div>
</section>

<!-- RESULTS -->
<main class="wrap stage" id="results" hidden>
  <div class="greet">
    <h1 id="resTitle"></h1>
    <p id="resSub"></p>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" autocomplete="off">
  </div>

  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="empty" id="empty" aria-live="polite"></div>
  <div class="morewrap" id="browseWrap"><button class="morebtn" id="browseBtn"></button></div>

  <!-- COMMUNITY -->
  <div class="community" id="community" hidden>
    <div class="t"><b id="commT"></b><p id="commP"></p></div>
    <div class="acts" id="commActs"></div>
  </div>
</main>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="App details"><div class="sheet" id="sheet"></div></div>

<script src="js/app.js"></script>
</body>
</html>
